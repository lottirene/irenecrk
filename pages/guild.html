<!-- HOME / LANDING PAGE -->
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- imports -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="shortcut icon"
        href="https://static.wikia.nocookie.net/cookierunkingdom/images/3/3c/Espresso_mc_lv3.png/revision/latest?cb=20220707162522"
        type="image/png">
    <script src="/js/navInjection.js" defer></script>
    <script src="/js/footerInjection.js" defer></script>
    <script src="/js/navCarousel.js" defer></script>

    <title>Guild | Irene CRK☕</title>
</head>

<body>
    <nav class="main-nav" id="navInjection">
        <!-- injected nav bar -->
        <p>Nav is loading</p>
    </nav>
    <header class="hero">
        <!-- hero section -->
        <div class="title-container">
            <h1>Guild</h1>
            <p>You either love it, or you hate it <span class="striked smaller">or you're in a toxic relationship with
                    it...</span><br> It's guild!☕</p>
        </div>
        <img src="https://static.wikia.nocookie.net/cookierunkingdom/images/a/a6/Espresso_illustration.png/revision/latest/scale-to-width-down/1000?cb=20211105095012"
            alt="Espresso Cookie Gacha Sprite" class="hero-sprite flip-image">
    </header>
    <main>
        <!-- main content -->
        <section class="popular-guides">
            <!-- carousel with popular guides -->
            <h2 class="text-deco-left text-deco-right">Guild Guides</h2>
            <div class="carousel" data-carousel-key="guild-guides">
                <button class="carousel-arrow carousel-prev">&lt;</button>
                <div class="carousel-viewport">
                    <div class="carousel-track"></div>
                </div>
                <button class="carousel-arrow carousel-next">&gt;</button>
            </div>
        </section>
    </main>
    <footer id="footerInjection">
        <!--injected footer -->
        <p>Footer is loading</p>
    </footer>
</body>

</html>
