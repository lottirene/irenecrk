<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Velvet Dragon Guide | Irene CRK☕</title>

    <!-- imports -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="shortcut icon"
        href="https://static.wikia.nocookie.net/cookierunkingdom/images/3/3c/Espresso_mc_lv3.png/revision/latest?cb=20220707162522"
        type="image/png">
    <script src="/js/navInjection.js" defer></script>
    <script src="/js/footerInjection.js" defer></script>
    <script src="/js/buildInjection.js" defer></script>
</head>

<body>
    <nav class="main-nav" id="navInjection"></nav>
    <header class="hero la">
        <div class="title-container">
            <h1>Red Velvet Dragon</h1>
            <p>33b+ team guide~</p>
        </div>
        <img src="https://static.wikia.nocookie.net/cookierunkingdom/images/f/f6/Red_Velvet_Dragon.png/revision/latest/scale-to-width-down/1000?cb=20220811211606"
            alt="Red Velvet Dragon Sprite" class="hero-sprite flip-image">
    </header>
    <main id="teamBuildPage" data-boss-name="Red Velvet Dragon" data-team-name="Standard">
        <section class="build-container">
            <div class="cookies" id="teamCookies" data-team-cookies>
                <p>Red Velvet Dragon team is loading...</p>
            </div>
            <div class="treasures">
                <p>Treasures are loading...</p>
            </div>
        </section>
        <section class="team-builds" id="teamBuilds" data-team-builds>
            <p>Team builds are loading...</p>
        </section>
        <h3>My Stats</h3>
        <section class="stats-grid" data-stats-images>
            <p>Stats images are loading...</p>
        </section>
        <div class="popup" id="popup">
            <span class="popup-close" id="popupClose">X</span>
            <figure>
                <img src="" alt="" id="popupImg">
                <figcaption id="popupCaption"></figcaption>
            </figure>
        </div>
        <hr class="section-divider">
        <h3>Video Guide & Run</h3>
        <div class="my-videos">
            <p>Videos are loading...</p>
        </div>
        <hr class="section-divider">
        <h3>Timings</h3>
        <section class="timings">
        </section>
    </main>
    <footer id="footerInjection"></footer>
</body>

</html>
