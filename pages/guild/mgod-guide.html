<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine God Guide | Irene CRK☕</title>

    <!-- imports -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="shortcut icon"
        href="https://static.wikia.nocookie.net/cookierunkingdom/images/3/3c/Espresso_mc_lv3.png/revision/latest?cb=20220707162522"
        type="image/png">
    <script src="/js/navInjection.js" defer></script>
    <script src="/js/footerInjection.js" defer></script>
    <script src="/js/buildInjection.js" defer></script>
</head>

<body>
    <nav class="main-nav" id="navInjection"></nav>
    <header class="hero mgod">
        <div class="title-container">
            <h1>Machine God of the Eternal Void</h1>
            <h2>32b+ team guide~</h2>
        </div>
        <img src="https://static.wikia.nocookie.net/cookierunkingdom/images/4/4d/Machine-God_of_the_Eternal_Void.png/revision/latest/"
            alt="Machine God of the Eternal Void Sprite" class="hero-sprite flip-image">
    </header>
    <main id="teamBuildPage" data-boss-name="Machine God of the Eternal Void" data-team-name="Standard">
        <section class="build-container">
            <div class="cookies" id="teamCookies" data-team-cookies>
                <p>Machine God team is loading...</p>
            </div>
            <div class="treasures">
                <p>Treasures are loading...</p>
            </div>
        </section>
        <section class="team-builds" id="teamBuilds" data-team-builds>
            <p>Team builds are loading...</p>
        </section>
        <h3>My Stats</h3>
        <section class="stats-grid" data-stats-images>
            <p>Stats images are loading...</p>
        </section>
        <hr class="section-divider">
        <div class="popup" id="popup">
            <span class="popup-close" id="popupClose">X</span>
            <figure>
                <img src="" alt="" id="popupImg">
                <img src="hhttps://static.wikia.nocookie.net/cookierunkingdom/images/f/f8/Cookie0513-run.gif/revision/latest?cb=20220110162511" alt="Placeholder" id="popupImg">
            </figure>
        </div>
        <section data-team-tables></section>
        <hr class="section-divider">
        <h3>Video Guide & Run</h3>
        <div class="my-videos">
            <p>Videos are loading...</p>
        </div>
        <hr class="section-divider">
        <h3>Timings</h3>
        <section class="timings">
        </section>
    </main>
    <footer id="footerInjection"></footer>
</body>

</html>
